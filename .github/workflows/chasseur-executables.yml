# Construit l'exécutable « Chasseur de sites » pour Windows et macOS (PyInstaller).
# Résultat : onglet « Actions » → dernière exécution → artefacts ChasseurDeSites-windows / -macos (fichiers ZIP).
name: Chasseur de sites – exécutables

on:
  workflow_dispatch:
  push:
    paths:
      - "chasseur-de-sites/**"
      - ".github/workflows/chasseur-executables.yml"

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: windows
          - os: macos-latest
            nom: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: chasseur-de-sites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Tests (ceux qui demandent Chromium sont ignorés)
        run: pytest -q
      - name: Construction
        run: pyinstaller packaging/chasseur.spec --noconfirm
      - name: Vérification
        env:
          CHASSEUR_SANS_INSTALLATION: "1"
        run: ./dist/ChasseurDeSites/ChasseurDeSites --version
        shell: bash
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.nom }}" = "windows" ]; then
            7z a ../ChasseurDeSites-windows.zip ChasseurDeSites
          else
            ditto -c -k --keepParent ChasseurDeSites ../ChasseurDeSites-macos.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ChasseurDeSites-${{ matrix.nom }}
          path: chasseur-de-sites/ChasseurDeSites-${{ matrix.nom }}.zip
          retention-days: 30
