name: Build BridgeToLeads (Windows .exe)

on:
  push:
    paths:
      - "tools/prospection/**"
      - ".github/workflows/bridgetoleads-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller openpyxl

      - name: Build BridgeToLeads.exe
        run: >
          pyinstaller --onefile --windowed --name BridgeToLeads
          --paths tools/prospection --hidden-import find_no_website --hidden-import brand_icon
          --hidden-import openpyxl --icon tools/prospection/assets/bridgetoleads.ico
          tools/prospection/bridgetoleads.pyw

      - name: Smoke test (CLI module imports in the build env)
        run: python tools/prospection/find_no_website.py --help

      - name: Zip the sales page
        shell: pwsh
        run: Compress-Archive -Path tools/prospection/site/* -DestinationPath dist/BridgeToLeads-site.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BridgeToLeads-windows
          path: |
            dist/BridgeToLeads.exe
            dist/BridgeToLeads-site.zip

      - name: Publish to the "BridgeToLeads" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridgetoleads-latest
          name: BridgeToLeads by ptabountchikoff (latest Windows build)
          target_commitish: ${{ github.sha }}
          body: |
            Download **BridgeToLeads.exe** below and double-click it. No Python needed.
            **BridgeToLeads-site.zip** is the sales page: unzip it and upload the folder to any static host.
            Windows may show "Windows protected your PC" the first time: click
            **More info → Run anyway** (the app is not code-signed).
          files: |
            dist/BridgeToLeads.exe
            dist/BridgeToLeads-site.zip
          prerelease: true
