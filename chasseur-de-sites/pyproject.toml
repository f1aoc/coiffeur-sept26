[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chasseur-de-sites"
version = "0.1.0"
description = "Repère les sites d'entreprises locales cassés ou obsolètes et les classe comme prospects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
chasseur = "chasseur.cli:main"

[tool.setuptools.packages.find]
include = ["chasseur*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "reseau: tests qui interrogent de vrais sites (désactivés par défaut, lancer avec -m reseau)",
]
addopts = "-m 'not reseau'"
